<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>中小企業診断士 学習ポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2e3345;
    --text: #e4e6ef;
    --text-muted: #8b90a5;
    --accent: #6c8aff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
  }
  h1 { font-size: 1.5rem; margin-bottom: 24px; text-align: center; color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    display: block;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover, .card:active {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 8px; }
  .card p { font-size: 0.85rem; color: var(--text-muted); }
  .badge {
    display: inline-block;
    background: rgba(108, 138, 255, 0.15);
    color: var(--accent);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: bold;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <h1>📘 SME Study Portal</h1>

  <a href="2021_prep.html" class="card">
    <span class="badge">最新予習</span>
    <h2>令和3年度(2021) 事前予習ガイド</h2>
    <p>事例Ⅰ〜Ⅳの頻出理論と解法の型。演習前のインプット用（ネタバレなし）</p>
  </a>

  <a href="2020_review.html" class="card">
    <span class="badge">復習・型</span>
    <h2>令和2年度(2020) 復習・攻略総まとめ</h2>
    <p>ダナドコ、4色ボールペン読解法など、基本OSの総まとめ</p>
  </a>

  <a href="npv_matrix.html" class="card">
    <span class="badge">フレームワーク</span>
    <h2>NPVマトリックス解法</h2>
    <p>事例Ⅳ NPV計算のタイムライン記述フォーマットと手順</p>
  </a>

</body>
</html>
